<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palyt Kitchen Stock</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header><p class="eyebrow">Palyt / Kitchen control</p><h1>Stock room</h1><p class="lede">Keep the kitchen's buffer visible before the menu makes a promise.</p></header>
      <section class="panel" aria-labelledby="stock-heading">
        <div class="panel-heading"><div><p class="eyebrow">Inventory</p><h2 id="stock-heading">Ingredients</h2></div><span id="stock-count" class="count"></span></div>
        <label class="search-label" for="stock-search">Find an ingredient <input id="stock-search" type="search" placeholder="Search stock"></label>
        <form id="ingredient-form" class="ingredient-form" novalidate>
          <input id="ingredient-id" type="hidden">
          <label>Name <input id="ingredient-name" required placeholder="e.g. Mint"></label>
          <label>Unit <select id="ingredient-unit"><option value="kg">kg</option><option value="L">L</option><option value="each">each</option></select></label>
          <label>In stock <input id="ingredient-quantity" type="number" min="0" step="0.001" required></label>
          <label>Par level <input id="ingredient-par" type="number" min="0.001" step="0.001" required></label>
          <button type="submit" id="ingredient-submit">Add ingredient</button><button type="button" id="ingredient-cancel" class="secondary hidden">Cancel edit</button>
          <p id="form-error" class="form-error" role="alert"></p>
        </form>
        <div class="table-wrap"><table><thead><tr><th>Ingredient</th><th>In stock</th><th>Par level</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="stock-list"></tbody></table></div>
      </section>
      <section class="panel menu-panel" aria-labelledby="menu-heading">
        <div class="panel-heading"><div><p class="eyebrow">Diner view</p><h2 id="menu-heading">Menu availability</h2></div><span id="order-message" class="count" role="status"></span></div>
        <div id="menu-list" class="menu-list"></div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
